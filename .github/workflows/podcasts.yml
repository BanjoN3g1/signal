name: Podcasts (transcribe & summarize new episodes)
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours, off the top of the hour
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # to dispatch the Pages workflow afterwards (documented GITHUB_TOKEN exception)
concurrency:
  group: podcasts
  cancel-in-progress: false
jobs:
  podcasts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests faster-whisper && (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      - name: Restore episode cache
        uses: actions/cache/restore@v4
        with:
          path: data/podcasts
          key: podcasts-${{ github.run_id }}
          restore-keys: podcasts-
      - name: Restore Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-v1
      - name: Fetch feeds, transcribe new episodes, summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CACHE_DIR: data/podcasts
        run: python podcasts.py
      - name: Save episode cache
        uses: actions/cache/save@v4
        with:
          path: data/podcasts
          key: podcasts-${{ github.run_id }}
      - name: Redeploy the site with the new episodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
